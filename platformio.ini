; Inkwatch - hardware smoke test for the Waveshare 2.9in (B) three-colour panel.
; Renders one static board screen with fake data. No WiFi, no polling.

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
lib_deps      = zinggjm/GxEPD2@^1.5.8
